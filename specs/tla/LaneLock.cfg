\* TLC configuration for LaneLock.tla (spec 014 Phase 1 pilot bounds).
\* Lanes and agents are symmetric model values below (2 lanes, 3 agents);
\* paths and lock sets live in the module (3 paths, 4 lock sets). Small by
\* design per the tla-author skill; widening Agents beyond 3 needs a
\* set-valued author history (see ASSUME Cardinality(Agents) <= 3).
CONSTANTS
  Lanes = {x, y}
  Agents = {alpha, beta, gamma}
  NoAgent = none
  Doctor = doctor
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS
  TypeOK
  Exclusivity
  CoverageForActive
  TerminalClean
  ReviewerSeparation
  ActiveHasLocks
  PrFlowRetention
  RepairBudgetBounded
  PrFlowNeedsPeerApproval
  RepairOwnerAssigned
  LastActorIsLaneAgent
  LinkedLaneStaysActive
  DecisionOnlyDuringRepair
  DispositionAfterEscalation
  AuthorSeparation
  PrReviewIsLinked
PROPERTIES
  RepairResolveNeedsDecision
  RepairClearByResponsibleActor
  RepairEnterAssignsLastActor
  PrFlowEntryByReviewer
  OwnerChangesOnlyByReassign
