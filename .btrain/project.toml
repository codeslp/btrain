[project]
name = "btrain"

[agents]
reviewer_default = "codex-reviewer"
writer_default = "codex"
active = ["codex", "codex-reviewer"]

[agents.runners]
"codex" = "codex"
"codex-reviewer" = "codex"

[lanes]
per_agent = 3
enabled = true
ids = ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o"]

[lanes.a]
handoff_path = ".claude/collab/HANDOFF_A.md"

[lanes.b]
handoff_path = ".claude/collab/HANDOFF_B.md"

[lanes.c]
handoff_path = ".claude/collab/HANDOFF_C.md"

[lanes.d]
handoff_path = ".claude/collab/HANDOFF_D.md"

[lanes.e]
handoff_path = ".claude/collab/HANDOFF_E.md"

[lanes.f]
handoff_path = ".claude/collab/HANDOFF_F.md"

[pr_flow]
enabled = true
base = "main"
required_bots = ["gh-codex", "codex-reviewer"]

[pr_flow.bots.gh-codex]
aliases = ["chatgpt-codex-connector[bot]", "chatgpt-codex-connector"]
request_body = "@codex review"

[pr_flow.bots.gh-unblocked]
aliases = ["unblocked[bot]", "unblocked"]
request_body = "@unblocked review again"

# A Codex peer reviewer. It has no GitHub account of its own: reviews are
# posted from the repo owner's account, so `codeslp` is the alias btrain matches
# on. That means this gate can be satisfied by a human comment from the owner as
# well as by a posted stand-in review — it is a weaker signal than a bot gate,
# and it is deliberately additive rather than a replacement for gh-codex.
[pr_flow.bots.codex-reviewer]
aliases = ["codex-reviewer", "codeslp"]
request_body = "Codex peer review required for this head. Record the independent Codex review verdict with its reviewed commit."

[lanes.g]
handoff_path = ".claude/collab/HANDOFF_G.md"

[lanes.h]
handoff_path = ".claude/collab/HANDOFF_H.md"

[lanes.i]
handoff_path = ".claude/collab/HANDOFF_I.md"

[lanes.j]
handoff_path = ".claude/collab/HANDOFF_J.md"

[lanes.k]
handoff_path = ".claude/collab/HANDOFF_K.md"

[lanes.l]
handoff_path = ".claude/collab/HANDOFF_L.md"

[lanes.m]
handoff_path = ".claude/collab/HANDOFF_M.md"

[lanes.n]
handoff_path = ".claude/collab/HANDOFF_N.md"

[lanes.o]
handoff_path = ".claude/collab/HANDOFF_O.md"

# cgraph (KeplerKG) integration. Gated off until spec 020 WS1 landed: before
# PR #63 an empty graph was reported as a clean pre-lock collision check, so
# enabling this made a false-clean result live. #63 merged 2026-09-16, so the
# graph now degrades honestly when it has nothing to say.
#
# `bin_path` is deliberately unset: the adapter resolves cgc/cgraph/kkg/
# codegraphcontext from PATH, which keeps this file free of machine-specific
# paths. `source_checkout` is likewise unset -- it would have to name a local
# fork clone, so `kkg sync-check` reports `no_source_checkout` here and the
# upstream-drift tip stays quiet until the config loader learns to expand an
# env var for it.
[cgraph]
enabled = true
advise_on = ["lock_overlap", "drift", "packet_truncated"]
